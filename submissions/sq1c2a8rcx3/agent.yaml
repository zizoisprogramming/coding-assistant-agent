# sq1c2a8rcx3 = sq1c2a8rcx with a setup agent first (scripts/make_skill_arms.py setup_arm)
# sq1c2a8rcx = sq1c2a8rc with its shell through run_command (scripts/make_skill_arms.py clock_rc)
# sq1c2a8rc = sq1 with the clock shell (skills/work, scripts/run.py) instead of run_command; sq1: SequentialAgent [fixer, finisher] (scripts/make_skill_arms.py sq2): the fixer (pub024 procedure) never
# submits and hands over in plain text; the finisher only submits (sq2 without the second attempt).
name: swe_agent
agent_class: SequentialAgent
sub_agents:
  - config_path: setup.yaml
  - config_path: fixer.yaml
  - config_path: finisher.yaml
