# Thinking ON since 10-09 (rung-1l): with "thinking off" the model reasoned anyway, invisibly, at the same cost
# (2.5-3.2x hidden tokens since wheelhouse 0.2.13); thinking on makes the thoughts visible and keeps them.
# Budget 512 since 10-09 (was 1,024: median 119, p90 677, steps of 25-40 s made first edits come at 220-299 s).
# Sampling per the Gemma 4 model card.
temperature: 1.0
top_p: 0.95
top_k: 64
max_output_tokens: 2048
thinking_config:
  include_thoughts: true
  thinking_budget: 512
